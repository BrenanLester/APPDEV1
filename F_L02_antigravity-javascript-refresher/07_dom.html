<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom.html</title>
</head>
<body>

    <h1>Meeting the Browser DOM</h1>

    <button id="colorButton">Change Background</button>

    <p id="message">Waiting for the message to update...</p>

    <script>
        const colorButton = document.getElementById("colorButton");
        const message = document.getElementById("message");

        colorButton.addEventListener("click", function() {
            document.body.style.backgroundColor = "lightblue";
        });

        setTimeout(function() {
            message.textContent = "The paragraph has been updated after 30 seconds!";
        }, 30000);
    </script>

</body>
</html>
